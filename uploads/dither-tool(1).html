<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DITHER UNIT // A-34</title>
<style>
  :root{
    --ink:#8f8fff;
    --ink-dim:#5a5abf;
    --bg:#050508;
    --panel:#0a0a12;
    --line:#2e2e5e;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:"Courier New",ui-monospace,monospace;
    min-height:100vh;
    padding:24px;
    background-image:radial-gradient(circle at 20% 10%, rgba(143,143,255,.05), transparent 40%);
  }
  .frame{
    max-width:1100px;margin:0 auto;
    border:1px solid var(--line);
    box-shadow:0 0 0 1px rgba(143,143,255,.08), 0 0 40px rgba(143,143,255,.06) inset;
  }
  header{
    display:flex;justify-content:space-between;align-items:center;
    border-bottom:1px solid var(--line);
    padding:10px 16px;
    letter-spacing:.2em;font-weight:bold;
    text-shadow:0 0 8px rgba(143,143,255,.6);
  }
  header .tag{font-size:11px;color:var(--ink-dim);letter-spacing:.15em}
  .grid{display:grid;grid-template-columns:300px 1fr;min-height:520px}
  @media(max-width:800px){.grid{grid-template-columns:1fr}}
  .controls{
    border-right:1px solid var(--line);
    padding:16px;display:flex;flex-direction:column;gap:14px;
    background:var(--panel);
  }
  @media(max-width:800px){.controls{border-right:none;border-bottom:1px solid var(--line)}}
  .ctl label{
    display:flex;justify-content:space-between;
    font-size:11px;letter-spacing:.12em;text-transform:uppercase;
    margin-bottom:6px;color:var(--ink);
  }
  .ctl label .val{color:var(--ink-dim)}
  input[type=range]{
    width:100%;-webkit-appearance:none;appearance:none;height:2px;
    background:var(--line);outline:none;
  }
  input[type=range]::-webkit-slider-thumb{
    -webkit-appearance:none;appearance:none;width:12px;height:12px;
    background:var(--ink);cursor:pointer;
    box-shadow:0 0 6px rgba(143,143,255,.8);
  }
  input[type=range]::-moz-range-thumb{
    width:12px;height:12px;border:none;background:var(--ink);cursor:pointer;
    box-shadow:0 0 6px rgba(143,143,255,.8);
  }
  select,button{
    width:100%;background:var(--bg);color:var(--ink);
    border:1px solid var(--line);padding:8px;
    font-family:inherit;font-size:12px;letter-spacing:.1em;
    cursor:pointer;text-transform:uppercase;
  }
  select:focus,button:focus{outline:1px solid var(--ink)}
  button:hover{background:var(--ink);color:var(--bg);text-shadow:none}
  .colors{display:flex;gap:10px}
  .colors .ctl{flex:1}
  input[type=color]{
    width:100%;height:32px;padding:2px;background:var(--bg);
    border:1px solid var(--line);cursor:pointer;
  }
  .stage{
    display:flex;align-items:center;justify-content:center;
    padding:20px;position:relative;min-height:400px;
  }
  #drop{
    position:absolute;inset:20px;border:1px dashed var(--line);
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:10px;cursor:pointer;text-align:center;padding:20px;
    transition:border-color .15s, background .15s;
  }
  #drop.hover{border-color:var(--ink);background:rgba(143,143,255,.04)}
  #drop .big{font-size:14px;letter-spacing:.2em}
  #drop .small{font-size:11px;color:var(--ink-dim);letter-spacing:.1em}
  #out{
    max-width:100%;max-height:70vh;
    image-rendering:pixelated;
    display:none;
    box-shadow:0 0 30px rgba(143,143,255,.15);
  }
  .hidden{display:none!important}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  footer{
    border-top:1px solid var(--line);padding:8px 16px;
    font-size:10px;color:var(--ink-dim);letter-spacing:.15em;
    display:flex;justify-content:space-between;
  }
  input[type=checkbox]{accent-color:var(--ink)}
  .chk{display:flex;align-items:center;gap:8px;font-size:11px;letter-spacing:.12em;text-transform:uppercase}
</style>
</head>
<body>
<div class="frame">
  <header>
    <span>DITHER UNIT</span>
    <span class="tag">SUBJECT PHOTO → 1-BIT</span>
  </header>
  <div class="grid">
    <div class="controls">
      <div class="ctl">
        <label>Матрица <span class="val" id="vMatrix">Bayer 8×8</span></label>
        <select id="matrix">
          <option value="8" selected>Bayer 8×8 (мелкая сетка)</option>
          <option value="4">Bayer 4×4</option>
          <option value="2">Bayer 2×2 (грубая)</option>
          <option value="noise">Noise (зерно)</option>
        </select>
      </div>
      <div class="ctl">
        <label>Разрешение <span class="val" id="vRes">180 px</span></label>
        <input type="range" id="res" min="60" max="400" value="180">
      </div>
      <div class="ctl">
        <label>Контраст <span class="val" id="vCon">1.6</span></label>
        <input type="range" id="con" min="0.5" max="4" step="0.1" value="1.6">
      </div>
      <div class="ctl">
        <label>Яркость <span class="val" id="vBri">0</span></label>
        <input type="range" id="bri" min="-100" max="100" value="0">
      </div>
      <div class="colors">
        <div class="ctl">
          <label>Чернила</label>
          <input type="color" id="ink" value="#8f8fff">
        </div>
        <div class="ctl">
          <label>Фон</label>
          <input type="color" id="bgc" value="#050508">
        </div>
      </div>
      <div class="row2">
        <div class="chk"><input type="checkbox" id="invert"><label for="invert">Инверт</label></div>
        <div class="chk"><input type="checkbox" id="glow" checked><label for="glow">Свечение</label></div>
      </div>
      <div class="ctl">
        <label>Экспорт, масштаб <span class="val" id="vScale">×4</span></label>
        <input type="range" id="scale" min="1" max="8" value="4">
      </div>
      <button id="save" class="hidden">Скачать PNG</button>
      <button id="reload" class="hidden">Другое фото</button>
    </div>
    <div class="stage">
      <div id="drop">
        <div class="big">[ ЗАГРУЗИТЬ ФОТО ]</div>
        <div class="small">клик или перетащи файл сюда<br>обрабатывается локально, никуда не отправляется</div>
      </div>
      <canvas id="out"></canvas>
      <input type="file" id="file" accept="image/*" class="hidden">
    </div>
  </div>
  <footer>
    <span>ORDERED DITHERING // BAYER MATRIX</span>
    <span id="dims">— × —</span>
  </footer>
</div>

<script>
(() => {
  const $ = id => document.getElementById(id);
  const drop = $('drop'), file = $('file'), out = $('out');
  let img = null;

  // Bayer matrices, normalized to 0..1 thresholds
  function bayer(n){
    if(n===2) return [[0,2],[3,1]].map(r=>r.map(v=>(v+0.5)/4));
    if(n===4){
      const m=[[0,8,2,10],[12,4,14,6],[3,11,1,9],[15,7,13,5]];
      return m.map(r=>r.map(v=>(v+0.5)/16));
    }
    // 8x8 built recursively from 4x4
    const b4=[[0,8,2,10],[12,4,14,6],[3,11,1,9],[15,7,13,5]];
    const m=[];
    for(let y=0;y<8;y++){m.push([]);
      for(let x=0;x<8;x++){
        m[y][x]=(4*b4[y%4][x%4]+[[0,2],[3,1]][Math.floor(y/4)][Math.floor(x/4)]+0.5)/64*4/4;
      }
    }
    // proper normalization: values 0..63
    const m2=[];
    for(let y=0;y<8;y++){m2.push([]);
      for(let x=0;x<8;x++){
        const v=4*b4[y%4][x%4]+[[0,2],[3,1]][Math.floor(y/4)][Math.floor(x/4)];
        m2[y][x]=(v+0.5)/64;
      }
    }
    return m2;
  }

  function hexRgb(h){
    return [parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)];
  }

  function render(){
    if(!img) return;
    const resW = +$('res').value;
    const con = +$('con').value;
    const bri = +$('bri').value;
    const inv = $('invert').checked;
    const glow = $('glow').checked;
    const mSel = $('matrix').value;
    const inkC = hexRgb($('ink').value);
    const bgC  = hexRgb($('bgc').value);

    const w = resW;
    const h = Math.round(resW * img.height / img.width);

    const small = document.createElement('canvas');
    small.width=w; small.height=h;
    const sc = small.getContext('2d');
    sc.drawImage(img,0,0,w,h);
    const d = sc.getImageData(0,0,w,h);
    const px = d.data;

    const M = mSel==='noise' ? null : bayer(+mSel);
    const mn = M ? M.length : 0;

    for(let y=0;y<h;y++){
      for(let x=0;x<w;x++){
        const i=(y*w+x)*4;
        let g = 0.299*px[i]+0.587*px[i+1]+0.114*px[i+2];
        g = (g-128)*con+128+bri;           // contrast + brightness
        g = Math.max(0,Math.min(255,g))/255;
        const t = M ? M[y%mn][x%mn] : Math.random();
        let on = g > t;
        if(inv) on = !on;
        const c = on ? inkC : bgC;
        px[i]=c[0]; px[i+1]=c[1]; px[i+2]=c[2]; px[i+3]=255;
      }
    }
    sc.putImageData(d,0,0);

    const scale = +$('scale').value;
    out.width = w*scale; out.height = h*scale;
    const oc = out.getContext('2d');
    oc.imageSmoothingEnabled = false;
    oc.fillStyle = $('bgc').value;
    oc.fillRect(0,0,out.width,out.height);
    if(glow){
      oc.save();
      oc.filter = `blur(${Math.max(2,scale)}px)`;
      oc.globalAlpha = 0.55;
      oc.globalCompositeOperation = 'lighter';
      oc.drawImage(small,0,0,out.width,out.height);
      oc.restore();
    }
    oc.imageSmoothingEnabled = false;
    oc.drawImage(small,0,0,out.width,out.height);

    out.style.display='block';
    drop.classList.add('hidden');
    $('save').classList.remove('hidden');
    $('reload').classList.remove('hidden');
    $('dims').textContent = `${out.width} × ${out.height}`;
  }

  function load(f){
    if(!f || !f.type.startsWith('image/')) return;
    const url = URL.createObjectURL(f);
    const im = new Image();
    im.onload = () => { img = im; URL.revokeObjectURL(url); render(); };
    im.src = url;
  }

  drop.addEventListener('click', ()=>file.click());
  file.addEventListener('change', e=>load(e.target.files[0]));
  ['dragover','dragenter'].forEach(ev=>drop.addEventListener(ev,e=>{e.preventDefault();drop.classList.add('hover')}));
  ['dragleave','drop'].forEach(ev=>drop.addEventListener(ev,e=>{e.preventDefault();drop.classList.remove('hover')}));
  drop.addEventListener('drop', e=>load(e.dataTransfer.files[0]));

  const live = ['res','con','bri','matrix','ink','bgc','invert','glow','scale'];
  live.forEach(id=>$(id).addEventListener('input', ()=>{
    $('vRes').textContent = $('res').value+' px';
    $('vCon').textContent = $('con').value;
    $('vBri').textContent = $('bri').value;
    $('vScale').textContent = '×'+$('scale').value;
    $('vMatrix').textContent = $('matrix').selectedOptions ? $('matrix').selectedOptions[0].text.split(' (')[0] : '';
    render();
  }));

  $('save').addEventListener('click', ()=>{
    out.toBlob(b=>{
      const a=document.createElement('a');
      a.href=URL.createObjectURL(b);
      a.download='dithered.png';
      a.click();
      setTimeout(()=>URL.revokeObjectURL(a.href),1000);
    },'image/png');
  });
  $('reload').addEventListener('click', ()=>{
    out.style.display='none';
    drop.classList.remove('hidden');
    file.value='';
  });
})();
</script>
</body>
</html>
